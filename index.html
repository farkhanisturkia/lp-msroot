<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/logo-white.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MsRoot | Building smart solutions for your needs.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://msroot.my.id/" />
    <meta property="og:title" content="MsRoot | Building smart solutions for your needs." />
    <meta property="og:description" content="We deliver innovative websites, custom software, and reliable IT solutions." />
    <meta property="og:image" content="https://msroot.my.id/thumbnail-msroot.png" />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:image" content="https://msroot.my.id/thumbnail-msroot.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Terapkan tema sebelum Vue mount agar tidak ada flash tema salah.
      // Sumber kebenaran: localStorage 'msroot-theme' (dark | light | system).
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var favicon = document.getElementById('favicon');

        function applyTheme() {
          var saved = null;
          try { saved = localStorage.getItem('msroot-theme'); } catch (e) {}
          var choice = (saved === 'dark' || saved === 'light' || saved === 'system') ? saved : 'system';
          var dark = choice === 'system' ? mq.matches : choice === 'dark';

          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (favicon) favicon.href = dark ? '/logo-white.png' : '/logo-black.png';
        }

        applyTheme();
        // Saat mode "system", ikuti perubahan preferensi OS (Vue juga akan
        // menerapkan ulang saat mount; penerapannya idempotent).
        mq.addEventListener('change', applyTheme);
      })();
    </script>
  </body>
</html>
